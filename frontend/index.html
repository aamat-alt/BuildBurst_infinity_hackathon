<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-xl shadow-on-surface/5 p-10 md:p-12 transition-all duration-200">
<!-- Top Monogram Badge -->
<div class="flex items-center justify-center">
<div class="w-12 h-12 rounded-xl flex items-center justify-center shadow-sm select-none" style="background-color: #0F172A;">
<svg class="w-7 h-7" fill="none" viewbox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
<!-- Abstract architectural N formed by overlapping geometric facets -->
<!-- Left upright & diagonal facet (Teal) -->
<path d="M5 23V5L15 17V23H11V11.5L5 23Z" fill="#0D9488"></path>
<!-- Right upright & diagonal facet overlapping (White) -->
<path d="M23 5V23L13 11V5H17V16.5L23 5Z" fill="#FFFFFF" fill-opacity="0.95"></path>
</svg>
</div>
</div>
<!-- Title & Subtitle -->
<div class="text-center mt-6">
<h1 class="font-display text-display text-on-surface">NovaWorks</h1>
<p class="font-body-md text-body-md text-secondary mt-1.5">
        Sign in to your delivery workspace
      </p>
</div>
<!-- Authentication Form -->
<form class="mt-8 space-y-5" id="login-form" novalidate>
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface" for="email">
          Email address
        </label>
<div class="relative">
<input autocomplete="email" class="w-full h-10 px-3.5 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface" for="password">
          Password
        </label>
<div class="relative">
<input autocomplete="current-password" class="w-full h-10 px-3.5 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<p class="hidden rounded-lg bg-error-container text-on-error-container font-body-sm text-body-sm px-3 py-2" id="login-error" role="alert"></p>
<!-- Submit Action -->
<div class="pt-2">
<button class="w-full h-11 bg-on-surface hover:bg-inverse-surface active:scale-[0.99] text-surface font-label-md text-label-md rounded-lg shadow-md transition-all duration-150 flex items-center justify-center cursor-pointer disabled:opacity-60 disabled:cursor-wait" id="login-submit" type="submit">
          Sign In
        </button>
</div>
</form>
</div>
</div></main><script src="js/api.js"></script><script src="js/login.js"></script></body></html>
